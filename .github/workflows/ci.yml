name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_migrate
          POSTGRES_PASSWORD: ci_migrate_pw
          POSTGRES_DB: edutech_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_migrate -d edutech_crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm_migrate:ci_migrate_pw@localhost:5432/edutech_crm
      DATABASE_APP_URL: postgresql+psycopg://crm_app:ci_app_pw@localhost:5432/edutech_crm
      POSTGRES_APP_USER: crm_app
      POSTGRES_APP_PASSWORD: ci_app_pw
      POSTGRES_DB: edutech_crm
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      LOG_LEVEL: warning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Test
        working-directory: backend
        run: pytest -v

  bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bff/package-lock.json
      - working-directory: bff
        run: npm ci
      - name: Lint
        working-directory: bff
        run: npm run lint
      - name: Build
        working-directory: bff
        run: npm run build
      - name: Test
        working-directory: bff
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hardcoded local service hostnames outside tests (CLAUDE.md rule 8)
        run: |
          set -e
          if grep -rEn "localhost|127\.0\.0\.1" \
              --include="*.py" --include="*.ts" --include="*.tsx" \
              backend/app bff/src frontend/src \
              | grep -v "__tests__\|test_\|\.test\."; then
            echo "::error::Found a hardcoded local hostname in app code outside tests — connect via env vars instead (CLAUDE.md rule 8)."
            exit 1
          fi
      - name: No email/phone referenced in a log call (CLAUDE.md rule 5)
        run: |
          set -e
          if grep -rEn "log(ger)?\.(info|warn|warning|error|debug)\([^)]*\b(email|phone)\b" \
              --include="*.py" --include="*.ts" --include="*.tsx" \
              backend/app bff/src; then
            echo "::error::Found a log call referencing email/phone directly — only tenant_id/user_id are allowed (CLAUDE.md rule 5)."
            exit 1
          fi

  image-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            target: ""
          - name: bff
            context: bff
            target: ""
          - name: frontend-dev
            context: frontend
            target: dev
          - name: frontend-production
            context: frontend
            target: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false

  helm-charts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [backend, bff, web, keycloak]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/${{ matrix.chart }}
      - name: helm template
        run: helm template test deploy/helm/${{ matrix.chart }} --set image.repository=example/${{ matrix.chart }} --set image.tag=v1

  compose-isolation:
    runs-on: ubuntu-latest
    needs: [backend, bff, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: docker compose up
        run: docker compose up -d --build
      - name: Wait for all services healthy
        run: |
          for i in $(seq 1 60); do
            total=$(docker compose ps -a --format '{{.Name}}' | wc -l)
            healthy=$(docker compose ps -a --format '{{.Health}}' | grep -c '^healthy$' || true)
            running_no_healthcheck=$(docker compose ps -a --format '{{.Name}} {{.Health}}' | grep -c ' $' || true)
            if [ "$((healthy + running_no_healthcheck))" -ge "$total" ]; then
              echo "All services healthy or running"; docker compose ps; exit 0
            fi
            sleep 5
          done
          echo "::error::Services did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: Tenant isolation E2E
        run: pytest tests/test_tenant_isolation.py -v
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
