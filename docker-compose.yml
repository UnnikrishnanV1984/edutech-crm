services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/edutech-crm HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./keycloak/realm-export.json:/app/dev-realm.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Celery worker + beat — same backend image, different CMD, entrypoint
  # bypassed so neither one re-runs docker-entrypoint.sh's migration/seed
  # steps (backend already does that once; both wait on it being healthy
  # first so the schema exists before either touches the DB).
  # PHASE_3_PLAN.md §9 step 13 — first real Celery work in this repo.
  worker:
    build: ./backend
    env_file: .env
    entrypoint: []
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy

  beat:
    build: ./backend
    env_file: .env
    entrypoint: []
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy

  # Dev/test-only stand-in for the Meta/Google/WhatsApp APIs — never
  # deployed in production (ARCHITECTURE.md §5/§6). Part of the default
  # stack, not an opt-in profile like minio: Phase 2's lead-capture
  # pipelines can't be exercised at all locally without it.
  mock-integrations:
    build: ./mock-integrations
    env_file: .env
    ports:
      - "${MOCK_INTEGRATIONS_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  bff:
    build: ./bff
    env_file: .env
    ports:
      - "${BFF_PORT:-4000}:4000"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      bff:
        condition: service_healthy

  minio:
    image: minio/minio
    profiles: ["storage"]
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
